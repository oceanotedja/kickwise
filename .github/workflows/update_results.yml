name: Update World Cup Results

on:
  schedule:
    # All times in BJT (UTC+8). GitHub Actions cron runs in UTC.
    - cron: '15 22 * * *'  #  6:15 BJT
    - cron: '15 1 * * *'   #  9:15 BJT
    - cron: '15 4 * * *'   # 12:15 BJT
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and update results
        run: python scripts/update_results.py

      - name: Commit and push if app.py changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet app.py; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          MSG=$(cat /tmp/wc_commit_msg.txt 2>/dev/null || echo "Update World Cup results")
          git add app.py
          git commit -m "$MSG"
          git push
