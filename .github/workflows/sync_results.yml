name: Sync WC2026 Results

on:
  schedule:
    # Runs every hour during tournament period (UTC).
    # Group stage: June 11 – June 27. Knockouts run to July 19.
    - cron: '0 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch latest results
        run: python scripts/fetch_results.py

      - name: Commit and push if results changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/manual_results.json; then
            git add data/manual_results.json
            git commit -m "chore: auto-sync WC2026 results [skip ci]"
            git push
            echo "✅ Pushed updated results"
          else
            echo "⏭️  No changes — skipping push"
          fi
